<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="arrowFeedback" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1600" height="1280" fill="#fafafa"/>

  <!-- Title -->
  <text x="800" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="32" fill="#111827">Crux AI — System Architecture</text>
  <text x="800" y="78" text-anchor="middle" font-size="14" fill="#6b7280" font-style="italic">7-agent shared-session pipeline · Flask web layer · Supabase + SMTP + Vercel</text>

  <!-- ========== TRIGGER ========== -->
  <g>
    <rect x="650" y="110" width="300" height="60" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="800" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">Trigger</text>
    <text x="800" y="158" text-anchor="middle" font-size="11" fill="#92400e">python3 orchestrator_v2.py · manual</text>
  </g>
  <line x1="800" y1="170" x2="800" y2="200" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== ORCHESTRATOR ========== -->
  <g>
    <rect x="400" y="200" width="800" height="120" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="800" y="230" text-anchor="middle" font-size="17" font-weight="700" fill="#5b21b6">OrchestratorV2  (host process)</text>
    <text x="800" y="252" text-anchor="middle" font-size="12" fill="#4c1d95">spawns 7 sessions · routes custom tool calls · maintains ONE shared_session_id for the whole run</text>
    <line x1="450" y1="270" x2="1150" y2="270" stroke="#a78bfa" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="800" y="290" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6" letter-spacing="1">CUSTOM TOOLS</text>
    <text x="800" y="308" text-anchor="middle" font-size="12" fill="#4c1d95" font-family="Menlo, Consolas, monospace">emit_event  ·  get_events  ·  send_email_smtp</text>
  </g>

  <!-- ========== AGENTS HEADER ========== -->
  <text x="380" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#374151" letter-spacing="2">MANAGED AGENTS  ·  CLAUDE CONSOLE</text>
  <line x1="60" y1="378" x2="700" y2="378" stroke="#374151" stroke-width="1.5"/>

  <!-- ========== AGENT 1: MEMORY ========== -->
  <g>
    <rect x="220" y="400" width="320" height="100" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <circle cx="252" cy="430" r="14" fill="#059669"/>
    <text x="252" y="435" text-anchor="middle" font-size="14" font-weight="700" fill="white">1</text>
    <text x="280" y="427" font-size="15" font-weight="700" fill="#065f46">Memory Agent</text>
    <text x="280" y="447" font-size="11" fill="#047857">Reads past briefs from session_events</text>
    <text x="280" y="465" font-size="11" fill="#047857">Emits:  covered_topics</text>
    <text x="280" y="488" font-size="10" fill="#6b7280" font-style="italic">prevents repeat coverage</text>
  </g>

  <!-- arrow Memory -> parallel fetch -->
  <line x1="380" y1="500" x2="380" y2="540" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== AGENTS 2 + 3: PARALLEL FETCH ========== -->
  <g>
    <rect x="60" y="540" width="300" height="100" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <circle cx="92" cy="570" r="14" fill="#059669"/>
    <text x="92" y="575" text-anchor="middle" font-size="14" font-weight="700" fill="white">2</text>
    <text x="120" y="567" font-size="15" font-weight="700" fill="#065f46">Research Launches</text>
    <text x="120" y="587" font-size="11" fill="#047857">Web search · filters by covered_topics</text>
    <text x="120" y="605" font-size="11" fill="#047857">Emits:  launches</text>
    <text x="120" y="628" font-size="10" fill="#6b7280" font-style="italic">parallel branch A</text>
  </g>

  <g>
    <rect x="400" y="540" width="300" height="100" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <circle cx="432" cy="570" r="14" fill="#059669"/>
    <text x="432" y="575" text-anchor="middle" font-size="14" font-weight="700" fill="white">3</text>
    <text x="460" y="567" font-size="15" font-weight="700" fill="#065f46">Research Papers</text>
    <text x="460" y="587" font-size="11" fill="#047857">arXiv / blogs · filters by covered_topics</text>
    <text x="460" y="605" font-size="11" fill="#047857">Emits:  papers</text>
    <text x="460" y="628" font-size="10" fill="#6b7280" font-style="italic">parallel branch B</text>
  </g>

  <!-- arrows to Evaluator -->
  <line x1="210" y1="640" x2="350" y2="690" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="640" x2="410" y2="690" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== AGENT 4: EVALUATOR ========== -->
  <g>
    <rect x="220" y="690" width="320" height="80" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <circle cx="252" cy="720" r="14" fill="#059669"/>
    <text x="252" y="725" text-anchor="middle" font-size="14" font-weight="700" fill="white">4</text>
    <text x="280" y="717" font-size="15" font-weight="700" fill="#065f46">Evaluator Agent</text>
    <text x="280" y="737" font-size="11" fill="#047857">Score + dedup the merged candidate set</text>
    <text x="280" y="755" font-size="11" fill="#047857">Emits:  ranked_items</text>
  </g>

  <line x1="380" y1="770" x2="380" y2="800" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== AGENT 5: WRITER ========== -->
  <g>
    <rect x="220" y="800" width="320" height="80" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <circle cx="252" cy="830" r="14" fill="#059669"/>
    <text x="252" y="835" text-anchor="middle" font-size="14" font-weight="700" fill="white">5</text>
    <text x="280" y="827" font-size="15" font-weight="700" fill="#065f46">Writer Agent</text>
    <text x="280" y="847" font-size="11" fill="#047857">Drafts the brief in markdown</text>
    <text x="280" y="865" font-size="11" fill="#047857">Emits:  draft_written</text>
  </g>

  <line x1="380" y1="880" x2="380" y2="910" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ========== AGENT 6: CRITIC + FEEDBACK LOOP ========== -->
  <g>
    <rect x="220" y="910" width="320" height="100" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <circle cx="252" cy="940" r="14" fill="#059669"/>
    <text x="252" y="945" text-anchor="middle" font-size="14" font-weight="700" fill="white">6</text>
    <text x="280" y="937" font-size="15" font-weight="700" fill="#065f46">Critic Agent</text>
    <text x="280" y="957" font-size="11" fill="#047857">Quality + style + banned-words check</text>
    <text x="280" y="975" font-size="11" fill="#047857">Emits:  draft_approved | draft_rejected</text>
    <text x="280" y="998" font-size="10" fill="#6b7280" font-style="italic">runs Python via code-exec tool</text>
  </g>

  <!-- Feedback loop arrow Critic -> Writer (rejected) -->
  <path d="M 540 945 Q 600 870 540 830" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowFeedback)"/>
  <text x="612" y="888" font-size="10" fill="#dc2626" font-weight="700">rejected</text>
  <text x="612" y="902" font-size="10" fill="#dc2626" font-style="italic">retry</text>

  <line x1="380" y1="1010" x2="380" y2="1040" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="395" y="1028" font-size="10" fill="#059669" font-weight="700">approved</text>

  <!-- ========== AGENT 7: DELIVERY ========== -->
  <g>
    <rect x="220" y="1040" width="320" height="100" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
    <circle cx="252" cy="1070" r="14" fill="#059669"/>
    <text x="252" y="1075" text-anchor="middle" font-size="14" font-weight="700" fill="white">7</text>
    <text x="280" y="1067" font-size="15" font-weight="700" fill="#065f46">Delivery Agent</text>
    <text x="280" y="1087" font-size="11" fill="#047857">Calls custom tool send_email_smtp</text>
    <text x="280" y="1105" font-size="11" fill="#047857">Emits:  email_sent</text>
    <text x="280" y="1128" font-size="10" fill="#6b7280" font-style="italic">orchestrator side-effect: save latest_issue.*</text>
  </g>

  <!-- ========== SHARED EVENT BUS (CENTER) ========== -->
  <g>
    <rect x="760" y="400" width="240" height="740" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <text x="880" y="438" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af" letter-spacing="1">SHARED EVENT BUS</text>
    <text x="880" y="460" text-anchor="middle" font-size="12" fill="#1e3a8a" font-family="Menlo, monospace">Supabase · session_events</text>
    <line x1="790" y1="478" x2="970" y2="478" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="880" y="500" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">columns</text>
    <text x="880" y="520" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Menlo, monospace">session_id</text>
    <text x="880" y="538" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Menlo, monospace">agent_name</text>
    <text x="880" y="556" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Menlo, monospace">event_type</text>
    <text x="880" y="574" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Menlo, monospace">data (jsonb)</text>
    <text x="880" y="592" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Menlo, monospace">created_at</text>

    <line x1="790" y1="620" x2="970" y2="620" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="880" y="650" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">how agents talk</text>
    <text x="880" y="678" text-anchor="middle" font-size="10" fill="#1e3a8a" font-style="italic">A writes via emit_event,</text>
    <text x="880" y="694" text-anchor="middle" font-size="10" fill="#1e3a8a" font-style="italic">B reads via get_events,</text>
    <text x="880" y="710" text-anchor="middle" font-size="10" fill="#1e3a8a" font-style="italic">all share one session_id</text>

    <line x1="790" y1="740" x2="970" y2="740" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="880" y="770" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">event timeline</text>
    <g font-size="10" fill="#1e3a8a" font-family="Menlo, monospace">
      <text x="780" y="795">→ covered_topics</text>
      <text x="780" y="813">→ launches</text>
      <text x="780" y="831">→ papers</text>
      <text x="780" y="849">→ ranked_items</text>
      <text x="780" y="867">→ draft_written</text>
      <text x="780" y="885">→ draft_approved</text>
      <text x="780" y="903">→ email_sent</text>
    </g>

    <line x1="790" y1="930" x2="970" y2="930" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="880" y="958" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">survives the run</text>
    <text x="880" y="980" text-anchor="middle" font-size="10" fill="#1e3a8a" font-style="italic">next week's Memory</text>
    <text x="880" y="996" text-anchor="middle" font-size="10" fill="#1e3a8a" font-style="italic">Agent reads previous</text>
    <text x="880" y="1012" text-anchor="middle" font-size="10" fill="#1e3a8a" font-style="italic">runs to dedupe topics</text>

    <line x1="790" y1="1040" x2="970" y2="1040" stroke="#60a5fa" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="880" y="1068" text-anchor="middle" font-size="11" fill="#1e40af" font-weight="700">also persisted</text>
    <text x="880" y="1090" text-anchor="middle" font-size="10" fill="#1e3a8a" font-family="Menlo, monospace">briefs/&lt;session_id&gt;</text>
    <text x="880" y="1106" text-anchor="middle" font-size="10" fill="#1e3a8a" font-family="Menlo, monospace">_log.json</text>
  </g>

  <!-- bidirectional arrows from each agent to bus -->
  <g stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4,3" fill="none">
    <line x1="540" y1="450" x2="755" y2="470" marker-end="url(#arrowDashed)"/>
    <line x1="360" y1="540" x2="755" y2="540" marker-end="url(#arrowDashed)"/>
    <line x1="700" y1="590" x2="755" y2="590" marker-end="url(#arrowDashed)"/>
    <line x1="540" y1="730" x2="755" y2="690" marker-end="url(#arrowDashed)"/>
    <line x1="540" y1="840" x2="755" y2="800" marker-end="url(#arrowDashed)"/>
    <line x1="540" y1="960" x2="755" y2="900" marker-end="url(#arrowDashed)"/>
    <line x1="540" y1="1090" x2="755" y2="990" marker-end="url(#arrowDashed)"/>
  </g>

  <!-- ========== RIGHT SIDE: OUTPUT + WEB LAYER ========== -->
  <text x="1280" y="365" text-anchor="middle" font-size="13" font-weight="700" fill="#374151" letter-spacing="2">SIDE EFFECTS  ·  PUBLIC WEB LAYER</text>
  <line x1="1020" y1="378" x2="1540" y2="378" stroke="#374151" stroke-width="1.5"/>

  <!-- arrow from Delivery Agent across to outputs -->
  <path d="M 540 1070 L 1080 1070 L 1080 460" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="1080" y="1058" font-size="10" fill="#6b7280" font-style="italic">side effects of send_email_smtp</text>

  <!-- SMTP -->
  <g>
    <rect x="1080" y="400" width="460" height="80" rx="8" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <text x="1310" y="427" text-anchor="middle" font-size="15" font-weight="700" fill="#9d174d">SMTP  ·  Gmail</text>
    <text x="1310" y="448" text-anchor="middle" font-size="11" fill="#9d174d">Per-recipient send · personalised email_renderer call</text>
    <text x="1310" y="466" text-anchor="middle" font-size="11" fill="#9d174d">subject + plain-text + HTML (with unsubscribe link)</text>
  </g>

  <line x1="1310" y1="480" x2="1310" y2="510" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Recipient inboxes -->
  <g>
    <rect x="1080" y="510" width="460" height="80" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="1310" y="537" text-anchor="middle" font-size="15" font-weight="700" fill="#9a3412">Recipient inboxes</text>
    <text x="1310" y="558" text-anchor="middle" font-size="11" fill="#9a3412">Footer:  "Unsubscribe" link → /unsubscribe?email=…</text>
    <text x="1310" y="576" text-anchor="middle" font-size="11" fill="#9a3412">TOC links → APP_BASE_URL/latest#item-N (Gmail-safe)</text>
  </g>

  <!-- Snapshot files -->
  <g>
    <rect x="1080" y="620" width="460" height="80" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="1310" y="647" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Latest issue snapshot</text>
    <text x="1310" y="668" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Menlo, monospace">latest_issue.html  ·  .md  ·  _meta.json</text>
    <text x="1310" y="686" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">written by _save_latest_issue() each send</text>
  </g>

  <line x1="1310" y1="700" x2="1310" y2="730" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Vercel app -->
  <g>
    <rect x="1080" y="730" width="460" height="280" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
    <text x="1310" y="760" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">Vercel  ·  app.py  (Flask)</text>
    <text x="1310" y="780" text-anchor="middle" font-size="11" fill="#7f1d1d" font-style="italic">https://ai-weekly-ecru.vercel.app</text>
    <line x1="1100" y1="795" x2="1520" y2="795" stroke="#fca5a5" stroke-width="1" stroke-dasharray="2,3"/>

    <g font-family="Menlo, Consolas, monospace" font-size="11" fill="#7f1d1d">
      <text x="1110" y="820" font-weight="700">GET</text>
      <text x="1150" y="820">/</text>
      <text x="1280" y="820" font-style="italic" font-family="-apple-system, sans-serif" fill="#991b1b">subscribe form (templates/index.html)</text>

      <text x="1110" y="845" font-weight="700">POST</text>
      <text x="1158" y="845">/api/subscribe</text>
      <text x="1280" y="845" font-style="italic" font-family="-apple-system, sans-serif" fill="#991b1b">cap @ 50  ·  insert into subscribers</text>

      <text x="1110" y="870" font-weight="700">GET</text>
      <text x="1150" y="870">/unsubscribe?email=…</text>
      <text x="1310" y="870" font-style="italic" font-family="-apple-system, sans-serif" fill="#991b1b">delete from subscribers</text>

      <text x="1110" y="895" font-weight="700">GET</text>
      <text x="1150" y="895">/latest</text>
      <text x="1280" y="895" font-style="italic" font-family="-apple-system, sans-serif" fill="#991b1b">serves latest_issue.html</text>

      <text x="1110" y="920" font-weight="700">GET</text>
      <text x="1150" y="920">/admin</text>
      <text x="1280" y="920" font-style="italic" font-family="-apple-system, sans-serif" fill="#991b1b">subscriber list</text>
    </g>

    <line x1="1100" y1="940" x2="1520" y2="940" stroke="#fca5a5" stroke-width="1" stroke-dasharray="2,3"/>
    <text x="1310" y="962" text-anchor="middle" font-size="10" font-weight="700" fill="#991b1b" letter-spacing="1">DEPLOYED VIA</text>
    <text x="1310" y="982" text-anchor="middle" font-size="11" fill="#7f1d1d" font-family="Menlo, monospace">index.py  →  from app import app</text>
    <text x="1310" y="1000" text-anchor="middle" font-size="10" fill="#7f1d1d" font-style="italic">Vercel serverless entry</text>
  </g>

  <!-- arrow from Vercel to subscribers -->
  <line x1="1310" y1="1010" x2="1310" y2="1040" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Supabase subscribers DB -->
  <g>
    <rect x="1080" y="1040" width="460" height="100" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="1310" y="1068" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Supabase  ·  subscribers</text>
    <text x="1310" y="1088" text-anchor="middle" font-size="11" fill="#1e3a8a" font-family="Menlo, monospace">{ id, email }</text>
    <text x="1310" y="1108" text-anchor="middle" font-size="11" fill="#1e3a8a">cap enforced at 50 entries</text>
    <text x="1310" y="1128" text-anchor="middle" font-size="10" fill="#6b7280" font-style="italic">read by orchestrator at send time (RECIPIENT_EMAILS env)</text>
  </g>

  <!-- ========== CROSS-CUTTING FOOTER ========== -->
  <line x1="60" y1="1180" x2="1540" y2="1180" stroke="#374151" stroke-width="1"/>
  <text x="800" y="1208" text-anchor="middle" font-size="12" font-weight="700" fill="#374151" letter-spacing="2">CROSS-CUTTING</text>
  <g font-size="11" fill="#4b5563">
    <text x="120" y="1238">📊  Observability:  Claude Console → Sessions (per-agent debug + token accounting)</text>
    <text x="120" y="1258">💰  Cost: only when running. Prompt caching ≈ 80% savings on input tokens.</text>
    <text x="900" y="1238">🔒  Trust: ANTHROPIC_API_KEY + SMTP creds → orchestrator only.  Supabase ANON → both.</text>
    <text x="900" y="1258">🗄️   Persistence:  session_events (Supabase) + briefs/*.json + latest_issue.*</text>
  </g>
</svg>
